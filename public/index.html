<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos de Inventario - AGROMUNDO</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    
    <style>
        :root {
            --primary: #2E7D32;
            --dark: #1E3A2F;
        }
        body[data-theme="dark"] {
            background: #121212;
            color: #e0e0e0;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .badge-entrada { background: #2E7D32; }
        .badge-salida { background: #c62828; }
    </style>
</head>
<body data-theme="light">

    <!-- HEADER -->
    <header class="header py-3 bg-dark text-white">
        <div class="container-fluid d-flex align-items-center justify-content-between px-4">
            <div class="d-flex align-items-center">
                <i class="fas fa-seedling fa-2x me-3"></i>
                <h2 class="mb-0">AGROMUNDO</h2>
            </div>
            <h4 class="mb-0">Movimientos de Inventario</h4>
            <div class="d-flex gap-2">
                <button onclick="toggleTheme()" class="btn btn-outline-light">
                    <i class="fas fa-moon"></i> Modo Noche
                </button>
                <button onclick="exportarCSV()" class="btn btn-success">
                    <i class="fas fa-file-csv"></i> CSV
                </button>
                <button onclick="exportarPDF()" class="btn btn-danger">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>
    </header>

    <div class="container-fluid mt-4">
        
        <!-- ESTADÍSTICAS -->
        <div class="row g-3 mb-4" id="stats"></div>

        <!-- GRÁFICOS -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Entradas vs Salidas</h5>
                        <canvas id="chartTipo"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Productos Más Movidos</h5>
                        <canvas id="chartProductos"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label>Producto</label>
                        <select id="filtroProducto" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos los productos</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>Tipo</label>
                        <select id="filtroTipo" class="form-select" onchange="aplicarFiltros()">
                            <option value="">Todos</option>
                            <option value="true">Entrada</option>
                            <option value="false">Salida</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Buscar por producto</label>
                        <input type="text" id="busqueda" class="form-control" placeholder="Escribe para buscar..." onkeyup="aplicarFiltros()">
                    </div>
                </div>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5><i class="fas fa-plus"></i> Registrar Nuevo Movimiento</h5>
            </div>
            <div class="card-body">
                <form id="formMovimientos" class="row g-3">
                    <div class="col-md-6">
                        <label>Producto</label>
                        <select id="id_producto" class="form-select" required></select>
                    </div>
                    <div class="col-md-6">
                        <label>Almacén</label>
                        <select id="id_almacen" class="form-select" required></select>
                    </div>
                    <div class="col-md-4">
                        <label>Tipo</label>
                        <select id="tipo" class="form-select" required>
                            <option value="true">✅ Entrada</option>
                            <option value="false">❌ Salida</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save"></i> Registrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card">
            <div class="card-header">
                <h5>Historial de Movimientos</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tablaMovimientos">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Producto</th>
                            <th>Almacén</th>
                            <th>Cantidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Editar Movimiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label>Producto</label>
                        <select id="editProducto" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label>Almacén</label>
                        <select id="editAlmacen" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label>Tipo</label>
                        <select id="editTipo" class="form-select">
                            <option value="true">Entrada</option>
                            <option value="false">Salida</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Cantidad</label>
                        <input type="number" id="editCantidad" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" onclick="guardarEdicion()" class="btn btn-warning">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="movimientos.js"></script>
</body>
</html>
