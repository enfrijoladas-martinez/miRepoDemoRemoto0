<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movimientos de Inventario - AGROMUNDO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Movimientos de Inventario - AGROMUNDO</h1>

        <form id="formMovimientos">
            <label>Producto</label>
            <select id="id_producto" required>
                <option value="101">Fertilizante NPK</option>
                <option value="102">Semilla Maíz</option>
                <option value="103">Pesticida Orgánico</option>
            </select>

            <label>Almacén</label>
            <select id="id_almacen" required>
                <option value="1">Bodega Principal</option>
                <option value="2">Almacén Campo</option>
            </select>

            <label>Tipo</label>
            <select id="tipo" required>
                <option value="true">✅ Entrada</option>
                <option value="false">❌ Salida</option>
            </select>

            <label>Cantidad</label>
            <input type="number" id="cantidad" min="1" required>

            <button type="submit">Registrar Movimiento</button>
        </form>

        <h2>Historial de Movimientos</h2>
        <table>
            <thead>
                <tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Almacén</th><th>Cantidad</th></tr>
            </thead>
            <tbody id="tablaMovimientos"></tbody>
        </table>
    </div>

    <script src="movimientos.js"></script>
</body>
</html>
